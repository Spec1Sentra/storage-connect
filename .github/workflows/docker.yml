name: Build and Push Docker Image

on:
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to registry'
        required: false
        default: 'true'
      tag_latest:
        description: 'Also tag as latest'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Read package version
        id: version
        run: |
          VERSION=$(jq -r '.version' < package_info.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=serengil/deepface:$VERSION" >> $GITHUB_OUTPUT
      
      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKER_HUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      
      - name: Log in to custom registry
        if: ${{ secrets.REGISTRY_URL != '' && secrets.REGISTRY_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event.inputs.push != 'false' && (github.event_name == 'release' || github.event.inputs.push == 'true') }}
          tags: |
            ${{ steps.version.outputs.tag }}
            ${{ github.event.inputs.tag_latest == 'true' && format('serengil/deepface:latest') || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
